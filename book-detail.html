<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Buku | Perpustakaan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="css/book-detail.css">
  </head>
  <body>
    <header class="bg-white shadow-md sticky top-0 z-50">
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center"
      >
        <h1 class="text-2xl font-bold text-gray-800">Perpustakaan Digital</h1>
        <div class="hidden md:flex items-center space-x-8">
          <a
            href="/library.html"
            class="text-gray-700 hover:text-blue-600 transition"
            >Beranda</a
          >
          <a
            href="/library.html#kategori"
            class="text-gray-700 hover:text-blue-600 transition"
            >Katalog</a
          >
          <a
            href="/about.html"
            class="text-gray-700 hover:text-blue-600 transition"
            >Tentang Kami</a
          >
        </div>
      </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div id="detail-container">
        <div
          id="loading-state"
          class="bg-white p-8 rounded-xl shadow-2xl flex flex-col lg:flex-row gap-10 animate-pulse"
        >
          <div class="lg:w-1/3 text-center">
            <div
              class="w-full max-w-xs mx-auto rounded-lg shadow-xl bg-gray-200 h-96"
            ></div>

            <div class="mt-8 h-12 w-full bg-gray-300 rounded-lg"></div>
            <div class="mt-4 h-8 w-1/2 bg-gray-200 rounded mx-auto"></div>
          </div>

          <div class="lg:w-2/3">
            <div class="h-10 w-3/4 bg-gray-300 rounded mb-4"></div>
            <div class="h-8 w-1/2 bg-gray-200 rounded mb-8"></div>

            <div class="space-y-3 p-4 bg-gray-50 rounded-lg">
              <div class="h-5 w-2/3 bg-gray-200 rounded"></div>
              <div class="h-5 w-1/2 bg-gray-200 rounded"></div>
              <div class="h-5 w-3/5 bg-gray-200 rounded"></div>
            </div>

            <h3 class="text-2xl font-semibold text-gray-800 mb-3 mt-8">
              Deskripsi
            </h3>
            <div class="space-y-2">
              <div class="h-4 w-full bg-gray-200 rounded"></div>
              <div class="h-4 w-full bg-gray-200 rounded"></div>
              <div class="h-4 w-5/6 bg-gray-200 rounded"></div>
            </div>
          </div>
        </div>
        <p class="text-center text-blue-600 font-semibold text-lg mt-8">
          Memuat detail buku... Mohon tunggu sebentar.
        </p>
      </div>
    </main>

    <footer class="bg-gray-800 text-white mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
        <p>&copy; 2025 Perpustakaan Digital. Ditenagai Google Books API.</p>
      </div>
    </footer>

    <script src="js/book-detail.js"></script>
  </body>
</html>
