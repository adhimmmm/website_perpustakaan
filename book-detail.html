<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detail Buku | Perpustakaan Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="css/book-detail.css">
  </head>
  <body>
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-2">
                    <svg class="h-8 w-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <span class="text-xl font-bold text-gray-800">Perpustakaan Digital</span>
                </div>

                <div class="hidden md:flex items-center space-x-8">
                    <a href="library.html" class="text-gray-700 hover:text-blue-600 transition">Beranda</a>
                    <a href="library.html#kategori" class="text-gray-700 hover:text-blue-600 transition">Katalog</a>
                    <a href="about.html" class="text-gray-700 hover:text-blue-600 transition">Tentang Kami</a>
                </div>

                <button id="mobile-menu-btn" class="md:hidden p-2">
                    <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>

            <div id="mobile-menu" class="hidden md:hidden pb-4 space-y-2">
                <a href="library.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">Beranda</a>
                <a href="library.html#kategori" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">Katalog</a>
                <a href="about.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-100 rounded">Tentang Kami</a>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
      <div id="detail-container">
        <div
          id="loading-state"
          class="bg-white p-8 rounded-xl shadow-2xl flex flex-col lg:flex-row gap-10 animate-pulse"
        >
          <div class="lg:w-1/3 text-center">
            <div
              class="w-full max-w-xs mx-auto rounded-lg shadow-xl bg-gray-200 h-96"
            ></div>

            <div class="mt-8 h-12 w-full bg-gray-300 rounded-lg"></div>
            <div class="mt-4 h-8 w-1/2 bg-gray-200 rounded mx-auto"></div>
          </div>

          <div class="lg:w-2/3">
            <div class="h-10 w-3/4 bg-gray-300 rounded mb-4"></div>
            <div class="h-8 w-1/2 bg-gray-200 rounded mb-8"></div>

            <div class="space-y-3 p-4 bg-gray-50 rounded-lg">
              <div class="h-5 w-2/3 bg-gray-200 rounded"></div>
              <div class="h-5 w-1/2 bg-gray-200 rounded"></div>
              <div class="h-5 w-3/5 bg-gray-200 rounded"></div>
            </div>

            <h3 class="text-2xl font-semibold text-gray-800 mb-3 mt-8">
              Deskripsi
            </h3>
            <div class="space-y-2">
              <div class="h-4 w-full bg-gray-200 rounded"></div>
              <div class="h-4 w-full bg-gray-200 rounded"></div>
              <div class="h-4 w-5/6 bg-gray-200 rounded"></div>
            </div>
          </div>
        </div>
        <p class="text-center text-blue-600 font-semibold text-lg mt-8">
          Memuat detail buku... Mohon tunggu sebentar.
        </p>
      </div>
    </main>

    <footer class="bg-gray-800 text-white mt-auto">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 text-center">
        <p>&copy; 2025 Perpustakaan Digital. Ditenagai Google Books API.</p>
      </div>
    </footer>

    <script src="js/book-detail.js"></script>
  </body>
</html>
